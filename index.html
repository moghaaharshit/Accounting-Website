  <!--
    ==========================================================================
    ACCOUNTING HARBOR — Single-file landing page (React via CDN)
    ==========================================================================
    CONFIGURATION NOTES FOR THE CLIENT / DEVELOPER:

    1. CONTACT FORM DELIVERY
       "Send Inquiry" validates the fields and then opens the visitor's email
       app (Gmail on most phones, Mail on desktop) as a pre-filled compose
       window: recipient, subject and every filled-in field are already written
       in — the visitor only has to press send. Set CONTACT_EMAIL (config block
       near the top of the script below) to your real inbox before publishing.
       Optional: if you ever prefer a backend instead, set CONTACT_ENDPOINT in
       the same config block (e.g. Formspree / Web3Forms / custom API URL) and
       the form will POST there instead. No API keys belong in this file.       2. DETAILS TO CONFIRM BEFORE PUBLICATION
       - The six proposed services and their descriptions.
       - FAQ answers regarding turnaround and service policies.
       - Package prices, limits and wording (draft rates supplied for the
         Packages section — replace or approve before going live).
       - Booking destination for "Book a Consultation" (currently scrolls to
         the on-page contact form — no external booking link is invented).
       - Company contact details, privacy policy and terms pages (omitted here
         on purpose so no fake links or details appear).
       - All dashboard numbers are fictional sample data, clearly labelled as
         an illustrative demonstration.
    ==========================================================================
  -->

  <style>
    /* ====================================================================
       1. DESIGN TOKENS
       ==================================================================== */
    :root {
      /* ===== PASTEL PALETTE - the only colors used on this site ===== */
      --pastel-red: #FFADAD;
      --pastel-orange: #FFD6A5;
      --pastel-yellow: #FDFFB6;
      --pastel-green: #CAFFBF;
      --pastel-cyan: #9BF6FF;
      --pastel-blue: #A0C4FF;
      --pastel-indigo: #BDB2FF;
      --pastel-pink: #FFC6FF;
      --white: #FFFFFF;

      /* Ink: text + line icons only (kept dark so copy stays readable) */
      --navy: #0E2A4E;
      --text: #1B2A3E;
      --muted: #5E6B7E;

      /* Role aliases - every one of them points into the palette above */
      --midnight: #0E2A4E;
      --blue: #0E2A4E;
      --blue-dark: #0E2A4E;
      --blue-soft: #FDFFB6;
      --bg: #FFFFFF;
      --mint: #CAFFBF;
      --mint-strong: #0E2A4E;
      --border: #FFD6A5;
      --danger: #FFADAD;
      --gold: #FDFFB6;
      --gold-deep: #FFD6A5;
      --blush: #FFC6FF;
      --radius: 18px;
      --radius-sm: 12px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Soft indigo shadows, derived from the palette */
      --shadow-sm: 0 1px 2px rgba(189, 178, 255, 0.4), 0 6px 16px rgba(189, 178, 255, 0.45);
      --shadow-md: 0 14px 34px rgba(189, 178, 255, 0.55);
      --shadow-lg: 0 32px 70px rgba(189, 178, 255, 0.65);
      --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    /* ====================================================================
       2. RESET & BASE
       ==================================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 16px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; }
    button { font-family: inherit; }
    ul { list-style: none; }
    section { scroll-margin-top: 96px; }
    :focus-visible {
      outline: 3px solid rgba(255, 214, 165, 0.6);
      outline-offset: 2px;
      border-radius: 6px;
    }
    ::selection { background: var(--pastel-yellow); color: var(--navy); }

    .skip-link {
      position: fixed; top: -60px; left: 16px; z-index: 300;
      background: var(--pastel-blue); color: var(--navy); padding: 10px 18px;
      border-radius: 0 0 10px 10px; font-weight: 700; font-size: 0.85rem;
      text-decoration: none; transition: top 0.25s var(--ease);
    }
    .skip-link:focus { top: 0; }

    /* ====================================================================
       3. LAYOUT UTILITIES
       ==================================================================== */
    .container { width: min(1180px, 100% - 40px); margin-inline: auto; }
    .section { padding: clamp(64px, 9vw, 110px) 0; position: relative; }
    .section-alt { background: var(--pastel-yellow); }
    .section-head { max-width: 660px; margin-bottom: clamp(38px, 5vw, 60px); }
    .section-head.center { margin-inline: auto; text-align: center; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.78rem; font-weight: 800; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--blue);
      background: var(--blue-soft); border-radius: 999px;
      padding: 7px 14px; margin-bottom: 18px;
    }
    .eyebrow.on-dark { background: rgba(255, 255, 255, 0.72); color: var(--navy); }
    .eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    h1, h2, h3, h4 { color: var(--navy); font-weight: 800; line-height: 1.15; letter-spacing: -0.02em; }
    .h2 { font-size: clamp(1.75rem, 3.4vw, 2.6rem); margin-bottom: 14px; }
    .section-desc { color: var(--muted); font-size: clamp(1rem, 1.4vw, 1.09rem); max-width: 620px; }
    .section-head.center .section-desc { margin-inline: auto; }

    /* ====================================================================
       4. BUTTONS
       ==================================================================== */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      font-weight: 700; font-size: 0.95rem; line-height: 1;
      padding: 15px 26px; border-radius: 13px; border: 1px solid transparent;
      cursor: pointer; text-decoration: none; white-space: nowrap;
      transition: transform 0.24s var(--ease), box-shadow 0.24s var(--ease),
                  background 0.24s var(--ease), border-color 0.24s var(--ease), color 0.24s var(--ease);
    }
    .btn svg { transition: transform 0.28s var(--ease); }
    .btn:hover svg { transform: translateX(3px); }
    .btn:active { transform: translateY(1px) scale(0.99); }
    .btn-primary {
      background: linear-gradient(135deg, #FDFFB6 0%, #FFD6A5 100%);
      color: #0E2A4E; box-shadow: 0 10px 24px rgba(255, 214, 165, 0.95);
    }
    .btn-primary:hover { transform: translateY(-2); box-shadow: 0 18px 34px rgba(255, 214, 165, 1); }
    .btn-secondary {
      background: var(--white); color: var(--navy);
      border-color: var(--border); box-shadow: var(--shadow-sm);
    }
    .btn-secondary:hover { transform: translateY(-2); border-color: #FFD6A5; box-shadow: var(--shadow-md); }
    .btn-outline-light {
      background: rgba(255, 255, 255, 0.7); color: var(--navy);
      border-color: rgba(255, 255, 255, 1);
    }
    .btn-outline-light:hover { background: #FFFFFF; transform: translateY(-2px); }
    .btn-block { width: 100%; }
    .btn[disabled] { opacity: 0.66; cursor: not-allowed; transform: none !important; }

    /* ====================================================================
       5. REVEAL & KEYFRAME ANIMATIONS
       ==================================================================== */
    [data-reveal] {
      opacity: 0; transform: translateY(26px);
      transition: opacity 0.75s var(--ease), transform 0.75s var(--ease);
      transition-delay: var(--d, 0s);
    }
    [data-reveal].is-visible { opacity: 1; transform: none; }

    @keyframes heroUp {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes heroFade {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: none; }
    }
    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes growBar {
      from { transform: scaleY(0); }
      to { transform: scaleY(1); }
    }
    @keyframes softPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(0.82); }
    }
    @keyframes spinOnce {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .hero-anim { animation: heroFade 0.85s var(--ease) both; }
    .dash-shell { animation: heroFade 1s var(--ease) 0.15s both; }
    .float-slow { animation: floaty 7s ease-in-out infinite; }

    /* Chart drawing */
    .chart-line { stroke-dasharray: 1; stroke-dashoffset: 1; }
    .is-visible .chart-line, .draw-now .chart-line {
      animation: drawLine 2s var(--ease) 0.3s forwards;
    }
    .chart-area { opacity: 0; }
    .is-visible .chart-area, .draw-now .chart-area {
      animation: fadeIn 1s var(--ease) 1.1s forwards;
    }
    .chart-dot { opacity: 0; }
    .is-visible .chart-dot, .draw-now .chart-dot {
      animation: fadeIn 0.5s var(--ease) 1.7s forwards;
    }
    .donut-seg { opacity: 0; }
    .is-visible .donut-seg, .draw-now .donut-seg {
      animation: fadeIn 0.7s var(--ease) forwards;
    }
    .bar { transform: scaleY(0); transform-origin: bottom; }
    .is-visible .bar, .draw-now .bar {
      animation: growBar 0.9s var(--ease) forwards;
    }
    .pulse-dot { animation: softPulse 2.4s ease-in-out infinite; }

    /* ====================================================================
       6. NAVIGATION
       ==================================================================== */
    .nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 120;
      transition: background 0.32s var(--ease), box-shadow 0.32s var(--ease);
    }
    .nav.scrolled {
      background: rgba(255, 255, 255, 0.93);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 1px 0 rgba(255, 214, 165, 0.95), 0 10px 34px rgba(189, 178, 255, 0.10);
    }
    .nav-inner {
      width: min(1180px, 100% - 40px); margin-inline: auto;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 16px 0;
      transition: padding 0.32s var(--ease);
    }
    .nav.scrolled .nav-inner { padding: 11px 0; }
    .brand {
      display: inline-flex; align-items: center; gap: 11px;
      text-decoration: none; font-weight: 800; font-size: 1.13rem;
      color: var(--navy); letter-spacing: -0.02em; flex-shrink: 0;
    }
    /* Nav / footer brand: real logo image (cropped to drop the tiny tagline line) */
    .brand-logo { display: inline-flex; align-items: center; }
    .brand-logo .logo-crop {
      display: block; height: 58px; overflow: hidden; line-height: 0;
      border-radius: 12px; box-shadow: 0 6px 18px rgba(189, 178, 255, 0.12);
    }
    .brand-logo .logo-crop img {
      display: block; height: calc(58px * 347 / 310); width: auto; max-width: none;
    }
    .nav-links { display: flex; align-items: center; gap: 4px; }
    .nav-link {
      position: relative; text-decoration: none; color: var(--muted);
      font-weight: 600; font-size: 0.92rem; padding: 9px 13px; border-radius: 9px;
      transition: color 0.22s var(--ease), background 0.22s var(--ease);
    }
    .nav-link::after {
      content: ''; position: absolute; left: 13px; right: 13px; bottom: 4px;
      height: 2px; border-radius: 2px; background: var(--blue);
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.28s var(--ease);
    }
    .nav-link:hover { color: var(--navy); }
    .nav-link:hover::after, .nav-link.active::after { transform: scaleX(1); }
    .nav-link.active { color: var(--navy); font-weight: 700; }
    .nav-cta { flex-shrink: 0; }
    .nav-cta .btn { padding: 12px 20px; font-size: 0.88rem; }

    .burger {
      display: none; flex-direction: column; justify-content: center; gap: 5px;
      width: 44px; height: 44px; padding: 10px; cursor: pointer;
      background: var(--white); border: 1px solid var(--border);
      border-radius: 11px; box-shadow: var(--shadow-sm);
    }
    .burger span {
      display: block; width: 100%; height: 2px; border-radius: 2px;
      background: var(--navy); transition: transform 0.3s var(--ease), opacity 0.2s var(--ease);
    }
    .burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .burger.open span:nth-child(2) { opacity: 0; }
    .burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .mobile-overlay {
      position: fixed; inset: 0; z-index: 110; background: rgba(14, 42, 78, 0.45);
      opacity: 0; pointer-events: none; transition: opacity 0.32s var(--ease);
    }
    .mobile-overlay.open { opacity: 1; pointer-events: auto; }
    .mobile-panel {
      position: fixed; top: 0; left: 0; right: 0; z-index: 115;
      background: var(--white); padding: 92px 22px 28px;
      box-shadow: 0 24px 50px rgba(189, 178, 255, 0.9);
      transform: translateY(-102%); transition: transform 0.42s var(--ease);
      max-height: 100vh; overflow-y: auto;
    }
    .mobile-panel.open { transform: translateY(0); }
    .mobile-links { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
    .mobile-link {
      text-decoration: none; color: var(--navy); font-weight: 700; font-size: 1.05rem;
      padding: 13px 10px; border-radius: 10px; border-bottom: 1px solid var(--border);
      transition: background 0.2s var(--ease), color 0.2s var(--ease), padding-left 0.25s var(--ease);
    }
    .mobile-link:hover, .mobile-link.active { background: var(--blue-soft); color: var(--blue); padding-left: 16px; }

    /* ====================================================================
       7. HERO
       ==================================================================== */
    .hero {
      position: relative;      padding: clamp(126px, 16vw, 186px) 0 clamp(84px, 10vw, 132px);
      background: linear-gradient(180deg, #FFFFFF 0%, #FDFFB6 100%); overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; top: -220px; right: -180px;
      width: 640px; height: 640px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 214, 165, 0.95) 0%, rgba(255, 214, 165, 0) 68%);
      pointer-events: none;
    }
    .hero::after {
      content: ''; position: absolute; bottom: -180px; left: -160px;
      width: 520px; height: 520px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 198, 255, 0.95) 0%, rgba(255, 198, 255, 0) 68%);
      pointer-events: none;
    }
    .hero-grid {
      position: relative; z-index: 2;
      display: grid; grid-template-columns: 1.02fr 0.98fr;
      gap: clamp(34px, 5vw, 64px); align-items: center;
    }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 9px;
      font-size: 0.76rem; font-weight: 800; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--blue);
      background: var(--blue-soft); border-radius: 999px; padding: 8px 16px;
      margin-bottom: 22px;
    }
    .hero h1 {
      font-size: clamp(2.3rem, 5.2vw, 3.75rem);
      letter-spacing: -0.035em; line-height: 1.06; margin-bottom: 20px;
    }
    .hero h1 .accent {
      background: linear-gradient(120deg, #FDFFB6 5%, #FFC6FF 95%);
      -webkit-box-decoration-break: clone; box-decoration-break: clone;
      padding: 0 0.08em; border-radius: 0.14em; color: var(--navy);
    }
    .hero-lead {
      color: var(--muted); font-size: clamp(1.02rem, 1.6vw, 1.15rem);
      max-width: 520px; margin-bottom: 30px;
    }
    .hero-ctas { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 22px; }
    .hero-note {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.88rem; color: var(--muted); font-weight: 600;
    }
    .hero-note svg { color: var(--mint-strong); flex-shrink: 0; }

    /* ====================================================================
       8. DASHBOARD (shared card styles)
       ==================================================================== */
    .dash-shell { position: relative; }
    .dash {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 22px; box-shadow: var(--shadow-lg);
      padding: 20px; position: relative; z-index: 2;
    }
    .dash-topbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 12px; margin-bottom: 16px; }
    .dash-title { font-size: 0.98rem; font-weight: 800; color: var(--navy); display: flex; align-items: center; gap: 9px; }
    .dash-title .live {
      width: 8px; height: 8px; border-radius: 50%; background: var(--pastel-green);
      box-shadow: 0 0 0 4px rgba(202, 255, 191, 0.9);
    }
    .chip {
      font-size: 0.66rem; font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase;
      padding: 5px 10px; border-radius: 999px; background: var(--blue-soft); color: var(--blue);
    }
    .chip.mint { background: var(--mint); color: #0E2A4E; }
    .chip.grey { background: #9BF6FF; color: var(--muted); }
    .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px 13px;
      transition: transform 0.26s var(--ease), box-shadow 0.26s var(--ease);
    }
    .stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .stat-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin-bottom: 5px; }
    .stat-value { font-size: clamp(0.98rem, 1.6vw, 1.16rem); font-weight: 800; color: var(--navy); letter-spacing: -0.02em; }
    .stat-trend { display: inline-flex; align-items: center; gap: 4px; font-size: 0.7rem; font-weight: 700; margin-top: 4px; color: var(--mint-strong); }
    .stat-trend.down { color: var(--muted); }
    .panel {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px 15px;
    }
    .dash-split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 470px) { .dash-split { grid-template-columns: 1fr; } }
    .panel-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 10px; }
    .panel-title { font-size: 0.8rem; font-weight: 800; color: var(--navy); }
    .panel-meta { font-size: 0.7rem; color: var(--muted); font-weight: 600; }
    .chart-wrap { position: relative; }
    .chart-svg { width: 100%; height: auto; display: block; }
    .tx-list { display: flex; flex-direction: column; gap: 8px; }
    .tx {
      display: flex; align-items: center; gap: 11px;
      padding: 9px 11px; border-radius: 12px; background: var(--bg);
      border: 1px solid transparent;
      transition: border-color 0.22s var(--ease), transform 0.22s var(--ease), background 0.22s var(--ease);
    }
    .tx:hover { border-color: var(--border); background: var(--white); transform: translateX(3px); }
    .tx-icon {
      width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
      display: grid; place-items: center;
      background: var(--blue-soft); color: var(--blue);
    }
    .tx-icon.out { background: #FFD6A5; color: var(--muted); }
    .tx-body { flex: 1; min-width: 0; }
    .tx-name { font-size: 0.82rem; font-weight: 700; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tx-cat { font-size: 0.7rem; color: var(--muted); font-weight: 600; }
    .tx-amount { font-size: 0.84rem; font-weight: 800; color: var(--mint-strong); white-space: nowrap; }
    .tx-amount.out { color: var(--text); }
    .recon { margin-top: 12px; }
    .recon-row { display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; font-weight: 700; color: var(--navy); margin-bottom: 7px; }
    .recon-row span.muted { color: var(--muted); font-weight: 600; }
    .progress { height: 8px; border-radius: 999px; background: var(--blue-soft); overflow: hidden; }
    .progress-fill {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, #A0C4FF, #BDB2FF);
      transform-origin: left; transform: scaleX(0);
    }
    .is-visible .progress-fill, .draw-now .progress-fill {
      animation: growBarX 1.2s var(--ease) 0.5s forwards;
    }
    @keyframes growBarX { to { transform: scaleX(1); } }
    .donut-legend { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
    .legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.74rem; font-weight: 600; color: var(--muted); }
    .legend-swatch { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
    .legend-item strong { color: var(--navy); font-weight: 800; margin-left: auto; }
    .dash-float {
      position: absolute; z-index: 3;
      background: var(--white); border: 1px solid var(--border);
      border-radius: 14px; box-shadow: var(--shadow-md);
      padding: 11px 14px; display: flex; align-items: center; gap: 10px;
    }
    .dash-float .fi {
      width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
      background: var(--mint); color: #0E2A4E; flex-shrink: 0;
    }
    .dash-float .ft { font-size: 0.72rem; color: var(--muted); font-weight: 700; line-height: 1.3; }
    .dash-float .fv { font-size: 0.88rem; color: var(--navy); font-weight: 800; line-height: 1.25; }
    .dash-float.tl { top: -22px; left: -26px; }
    .dash-float.br { bottom: -24px; right: -18px; }
    .dash-label {
      position: absolute; bottom: -34px; left: 50%; transform: translateX(-50%);
      font-size: 0.72rem; font-weight: 700; color: var(--muted);
      background: rgba(255, 255, 255, 0.94); padding: 4px 12px; border-radius: 999px;
      border: 1px solid var(--border); white-space: nowrap; z-index: 4;
    }

    /* ====================================================================
       9. TRUST / VALUE SECTION
       ==================================================================== */
    .trust-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .trust-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 26px 22px;
      box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), border-color 0.3s var(--ease);
    }
    .trust-card::after {
      content: ''; position: absolute; inset: auto 0 0; height: 3px;
      background: linear-gradient(90deg, #FFD6A5, #CAFFBF);
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.4s var(--ease);
    }
    .trust-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); border-color: #FFD6A5; }
    .trust-card:hover::after { transform: scaleX(1); }
    .icon-badge {
      width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center;
      background: var(--blue-soft); color: var(--blue); margin-bottom: 18px;
      transition: transform 0.3s var(--ease), background 0.3s var(--ease);
    }
    .trust-card:hover .icon-badge { transform: scale(1.07) rotate(-3deg); }
    .icon-badge.mint { background: var(--mint); color: #0E2A4E; }
    .trust-card h3 { font-size: 1.06rem; margin-bottom: 8px; }
    .trust-card p { font-size: 0.92rem; color: var(--muted); }

    /* ====================================================================
       10. SERVICES
       ==================================================================== */
    .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .service-card {
      display: flex; flex-direction: column;
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 28px 26px;
      box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
      transition: transform 0.32s var(--ease), box-shadow 0.32s var(--ease), border-color 0.32s var(--ease);
    }
    .service-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #FFD6A5, #FDFFB6);
      transform: scaleX(0); transform-origin: left;
      transition: transform 0.45s var(--ease);
    }
    .service-card:hover {
      transform: translateY(-8px); box-shadow: var(--shadow-lg); border-color: #FFD6A5;
    }
    .service-card:hover::before { transform: scaleX(1); }
    .service-card .icon-badge { margin-bottom: 20px; }
    .service-card:hover .icon-badge { transform: translateY(-2px) scale(1.06); }
    .service-card h3 { font-size: 1.14rem; margin-bottom: 9px; }
    .service-card p { color: var(--muted); font-size: 0.94rem; margin-bottom: 20px; flex: 1; }
    .card-link {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 0.88rem; font-weight: 800; color: var(--blue); text-decoration: none;
    }
    .card-link svg { transition: transform 0.3s var(--ease); }
    .service-card:hover .card-link svg { transform: translateX(5px); }

    /* ====================================================================
       10B. PACKAGES / PRICING
       ==================================================================== */
    .packages-section {
      background: linear-gradient(168deg, #A0C4FF 0%, #BDB2FF 48%, #FFC6FF 100%);
      position: relative; overflow: hidden;
    }
    .packages-section::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.55) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.55) 1px, transparent 1px);
      background-size: 42px 42px;
    }
    .packages-section::after {
      content: ''; position: absolute; top: -170px; left: 50%; transform: translateX(-50%);
      width: 680px; height: 430px; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0) 70%);
    }
    .packages-section .container { position: relative; z-index: 2; }
    .packages-section h2, .packages-section .pkg-name { color: var(--navy); }
    .packages-section .section-desc { color: rgba(14, 42, 78, 0.72); }
    .packages-section .eyebrow { background: rgba(255, 255, 255, 0.72); color: var(--navy); }
    .pkg-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
    .pkg-card {
      position: relative; display: flex; flex-direction: column;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 20px; padding: 30px 26px 26px;
      transition: transform 0.32s var(--ease), border-color 0.32s var(--ease),
                  box-shadow 0.32s var(--ease), background 0.32s var(--ease);
    }
    .pkg-card:hover {
      transform: translateY(-7px); background: #FFFFFF;
      border-color: rgba(255, 255, 255, 1); box-shadow: 0 26px 54px rgba(189, 178, 255, 0.85);
    }
    .pkg-card.popular {
      border-color: rgba(255, 255, 255, 1);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 18px 44px rgba(189, 178, 255, 0.95);
    }
    .pkg-card.popular:hover { border-color: rgba(255, 255, 255, 1); }
    .pkg-badge {
      position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #FDFFB6, #FFD6A5); color: #0E2A4E;
      font-size: 0.65rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 7px 17px; border-radius: 999px; white-space: nowrap;
      box-shadow: 0 8px 18px rgba(255, 214, 165, 0.35);
    }
    .pkg-name { font-size: 1.13rem; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.01em; }
    .pkg-price { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 4px; margin-bottom: 12px; }
    .pkg-price .amount {
      font-size: clamp(1.85rem, 2.5vw, 2.2rem); font-weight: 800; color: var(--navy);
      letter-spacing: -0.03em;
    }
    .pkg-price .per { font-size: 0.85rem; font-weight: 600; color: rgba(14, 42, 78, 0.6); }
    .pkg-desc {
      font-size: 0.9rem; color: rgba(14, 42, 78, 0.68); line-height: 1.65;
      margin-bottom: 20px; min-height: 4.95em;
    }
    .pkg-features { display: flex; flex-direction: column; gap: 12px; margin-bottom: 26px; flex: 1; }
    .pkg-features li {
      display: flex; align-items: flex-start; gap: 10px;
      font-size: 0.88rem; color: rgba(14, 42, 78, 0.86); line-height: 1.5;
    }
    .pkg-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #FFD6A5;
      flex-shrink: 0; margin-top: 0.5em;
      box-shadow: 0 0 0 3px rgba(255, 214, 165, 0.16);
    }
    .pkg-btn { margin-top: auto; width: 100%; }
    .btn-gold {
      background: linear-gradient(135deg, #FDFFB6, #FFD6A5); color: #0E2A4E;
      box-shadow: 0 12px 26px rgba(255, 214, 165, 0.28); font-weight: 800;
    }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 18px 34px rgba(255, 214, 165, 0.4); }
    .btn-outline-light-dark {
      background: rgba(255, 255, 255, 0.75); color: var(--navy);
      border-color: rgba(255, 255, 255, 1);
    }
    .btn-outline-light-dark:hover {
      background: #FFFFFF; transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 1);
    }
    .pkg-note {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      margin-top: 30px; font-size: 0.87rem; font-weight: 600;
      color: rgba(14, 42, 78, 0.62); text-align: center;
    }
    .pkg-note svg { flex-shrink: 0; color: var(--navy); }
    @media (max-width: 1080px) { .pkg-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 620px) {
      .pkg-grid { grid-template-columns: 1fr; }
      .pkg-desc { min-height: 0; }
    }

    /* ====================================================================
       11. WHO WE HELP
       ==================================================================== */
    .audience-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .audience-visual {
      margin: clamp(30px, 4.5vw, 52px) auto 0; max-width: 760px;
      border-radius: 24px; overflow: hidden; background: #fff;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg), 0 34px 66px -30px rgba(189, 178, 255, 0.5);
    }
    .audience-visual img { display: block; width: 100%; height: auto; }
    .audience-card {
      border-radius: var(--radius); padding: 28px 24px; position: relative; overflow: hidden;
      background: var(--white); border: 1px solid var(--border); box-shadow: var(--shadow-sm);
      transition: transform 0.32s var(--ease), box-shadow 0.32s var(--ease);
    }
    .audience-card:hover { transform: translateY(-7px); box-shadow: var(--shadow-md); }
    .audience-num {
      position: absolute; top: 14px; right: 18px;
      font-size: 2.6rem; font-weight: 800; letter-spacing: -0.04em;
      color: rgba(14, 42, 78, 0.06); line-height: 1;
      transition: color 0.3s var(--ease), transform 0.3s var(--ease);
    }
    .audience-card:hover .audience-num { color: rgba(255, 198, 255, 1); transform: translateY(-3px); }
    .audience-card .icon-badge { margin-bottom: 18px; }
    .audience-card h3 { font-size: 1.08rem; margin-bottom: 8px; }
    .audience-card p { font-size: 0.91rem; color: var(--muted); }

    /* ====================================================================
       12. WHY / BENEFITS SPLIT
       ==================================================================== */
    .why-grid {
      display: grid; grid-template-columns: 1fr 0.92fr;
      gap: clamp(34px, 5vw, 68px); align-items: center;
    }
    .why-list { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; }
    .why-item { display: flex; align-items: flex-start; gap: 13px; }
    .why-check {
      width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; margin-top: 1px;
      display: grid; place-items: center; background: var(--mint); color: #0E2A4E;
      transition: transform 0.25s var(--ease);
    }
    .why-item:hover .why-check { transform: scale(1.12); }
    .why-item span { font-weight: 600; color: var(--text); font-size: 0.99rem; }
    .report-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 22px; box-shadow: var(--shadow-lg); padding: 24px;
      position: relative;
    }
    .report-head {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 16px;
    }
    .report-title { font-weight: 800; font-size: 0.98rem; color: var(--navy); }
    .report-sub { font-size: 0.72rem; color: var(--muted); font-weight: 600; }
    .report-rows { display: flex; flex-direction: column; gap: 13px; margin-bottom: 18px; }
    .report-row-top { display: flex; justify-content: space-between; font-size: 0.83rem; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
    .report-row-top .val { font-weight: 800; }
    .report-bar { height: 9px; background: var(--bg); border-radius: 999px; overflow: hidden; }
    .report-bar i {
      display: block; height: 100%; border-radius: 999px;
      transform-origin: left; transform: scaleX(0);
    }
    .is-visible .report-bar i { animation: growBarX 1.1s var(--ease) forwards; }
    .report-footer {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 14px; padding: 13px 15px;
    }
    .report-footer .rf-label { font-size: 0.74rem; color: var(--muted); font-weight: 700; }
    .report-footer .rf-value { font-size: 1.15rem; font-weight: 800; color: var(--navy); letter-spacing: -0.02em; }
    .stamp {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--mint); color: #0E2A4E; font-size: 0.7rem; font-weight: 800;
      padding: 6px 11px; border-radius: 999px; letter-spacing: 0.05em; text-transform: uppercase;
    }

    /* ====================================================================
       13. PROCESS
       ==================================================================== */
    .process-wrap { position: relative; }
    .process-line {
      position: absolute; top: 34px; left: 12%; right: 12%; height: 2px;
      background-image: linear-gradient(90deg, rgba(189, 178, 255, 0.95) 55%, transparent 0%);
      background-size: 14px 2px; background-repeat: repeat-x;
    }
    .process-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; position: relative; }
    .step { text-align: center; padding: 0 12px; }
    .step-num {
      width: 68px; height: 68px; margin: 0 auto 20px; border-radius: 20px;
      display: grid; place-items: center; position: relative;
      background: var(--white); border: 1px solid var(--border); box-shadow: var(--shadow-md);
      font-size: 1.2rem; font-weight: 800; color: var(--blue);
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
    }
    .step:hover .step-num { transform: translateY(-5px) scale(1.04); box-shadow: var(--shadow-lg); }
    .step h3 { font-size: 1.16rem; margin-bottom: 9px; }
    .step p { color: var(--muted); font-size: 0.95rem; max-width: 320px; margin-inline: auto; }

    /* ====================================================================
       14. DASHBOARD SHOWCASE
       ==================================================================== */
    .showcase-shell {
      background: linear-gradient(160deg, #9BF6FF 0%, #A0C4FF 58%, #BDB2FF 100%);
      border-radius: 30px; padding: clamp(26px, 4.4vw, 56px);
      position: relative; overflow: hidden;
    }
    .showcase-shell::before {
      content: ''; position: absolute; top: -140px; right: -110px;
      width: 420px; height: 420px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 70%);
    }
    .showcase-shell::after {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.55) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.55) 1px, transparent 1px);
      background-size: 44px 44px; pointer-events: none;
    }
    .showcase-head {
      position: relative; z-index: 2; display: flex; flex-wrap: wrap; align-items: flex-end;
      justify-content: space-between; gap: 16px; margin-bottom: 28px;
    }
    .showcase-head h2 { color: var(--navy); font-size: clamp(1.5rem, 3vw, 2.1rem); }
    .showcase-head p { color: rgba(14, 42, 78, 0.75); font-size: 0.95rem; max-width: 440px; margin-top: 8px; }
    .sample-chip {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255, 255, 255, 0.8); color: var(--navy);
      border: 1px solid rgba(255, 255, 255, 1);
      font-size: 0.74rem; font-weight: 800; letter-spacing: 0.07em; text-transform: uppercase;
      padding: 8px 14px; border-radius: 999px;
    }
    .showcase-grid {
      position: relative; z-index: 2;
      display: grid; grid-template-columns: 1.5fr 1fr; gap: 18px;
    }
    .showcase-main { display: flex; flex-direction: column; gap: 18px; }
    .showcase-side { display: flex; flex-direction: column; gap: 18px; }
    .showcase-shell .panel, .showcase-shell .dash {
      background: rgba(255, 255, 255, 0.98); box-shadow: 0 22px 44px rgba(189, 178, 255, 0.85);
    }
    .showcase-shell .stat { background: var(--white); }
    .report-preview { display: flex; flex-direction: column; gap: 9px; }
    .rp-row {
      display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; align-items: center;
      font-size: 0.78rem; padding: 9px 11px; border-radius: 10px; background: var(--bg);
    }
    .rp-row.head { background: transparent; font-weight: 800; color: var(--muted); text-transform: uppercase; font-size: 0.66rem; letter-spacing: 0.08em; padding-top: 0; }
    .rp-row .rp-name { font-weight: 700; color: var(--navy); }
    .rp-row .rp-val { font-weight: 800; color: var(--text); text-align: right; }
    .rp-row.total { background: var(--blue-soft); }
    .rp-row.total .rp-name, .rp-row.total .rp-val { color: var(--blue); }
    .month-axis { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 12px; margin-top: 8px; padding: 0 4px; }
    .month-axis span { font-size: 0.66rem; font-weight: 700; color: var(--muted); }

    /* Prevent grid/flex blowout: items must be allowed to shrink below
       their intrinsic content size so narrow viewports never clip. */
    .hero-grid > *, .trust-grid > *, .services-grid > *, .audience-grid > *,
    .why-grid > *, .process-grid > *, .showcase-grid > *, .expect-grid > *,
    .contact-grid > *, .footer-grid > *, .form-row > *, .stat-row > *,
    .dash-split > *, .showcase-main > *, .showcase-side > *, .faq-wrap > * {
      min-width: 0;
    }

    /* ====================================================================
       15. EXPECTATIONS
       ==================================================================== */
    .expect-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .expect-card {
      background: var(--white); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 30px 26px; box-shadow: var(--shadow-sm); text-align: left;
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
      position: relative; overflow: hidden;
    }
    .expect-card::before {
      content: ''; position: absolute; top: -46px; right: -46px;
      width: 130px; height: 130px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 214, 165, 0.16), transparent 70%);
      transition: transform 0.4s var(--ease);
    }
    .expect-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-md); }
    .expect-card:hover::before { transform: scale(1.35); }
    .expect-card h3 { font-size: 1.14rem; margin-bottom: 9px; }
    .expect-card p { color: var(--muted); font-size: 0.94rem; }

    /* ====================================================================
       16. FAQ
       ==================================================================== */
    .faq-wrap { max-width: 800px; margin-inline: auto; }
    /*
      Reveal is driven by the WRAPPER (.faq-wrap), never by .faq-item itself:
      React rewrites the item's className when it opens/closes, which would wipe
      an observer-added class on the item and hide the question being clicked.
      The wrapper's className never changes, so its revealed state survives.
    */
    .faq-wrap[data-reveal] .faq-item {
      opacity: 0; transform: translateY(22px);
      transition: opacity 0.65s var(--ease) var(--d, 0s), transform 0.65s var(--ease) var(--d, 0s),
                  box-shadow 0.3s var(--ease), border-color 0.3s var(--ease);
    }
    .faq-wrap[data-reveal].is-visible .faq-item { opacity: 1; transform: none; }
    .faq-item {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 16px; margin-bottom: 12px; overflow: hidden;
      transition: box-shadow 0.3s var(--ease), border-color 0.3s var(--ease);
    }
    .faq-item.open { box-shadow: var(--shadow-md); border-color: #FFD6A5; }
    .faq-q {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: none; border: none; cursor: pointer; text-align: left;
      padding: 20px 22px; font-size: 1.01rem; font-weight: 700; color: var(--navy);
      transition: color 0.22s var(--ease);
    }
    .faq-q:hover { color: var(--blue); }
    .faq-icon {
      width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
      display: grid; place-items: center;
      background: var(--blue-soft); color: var(--blue);
      transition: transform 0.35s var(--ease), background 0.3s var(--ease), color 0.3s var(--ease);
    }
    .faq-item.open .faq-icon { transform: rotate(135deg); background: var(--pastel-indigo); color: var(--navy); }
    .faq-a-grid {
      display: grid; grid-template-rows: 0fr; visibility: hidden;
      transition: grid-template-rows 0.42s var(--ease), visibility 0s linear 0.42s;
    }
    .faq-item.open .faq-a-grid {
      grid-template-rows: 1fr; visibility: visible;
      transition: grid-template-rows 0.42s var(--ease), visibility 0s linear 0s;
    }
    .faq-a-inner { overflow: hidden; }
    .faq-a {
      padding: 0 22px 22px; color: var(--muted); font-size: 0.95rem; line-height: 1.7;
    }
    .faq-note {
      text-align: center; margin-top: 26px; font-size: 0.85rem; color: var(--muted);
      display: inline-flex; align-items: center; gap: 8px; margin-inline: auto;
      background: var(--white); border: 1px dashed var(--border);
      border-radius: 999px; padding: 10px 18px;
    }

    /* ====================================================================
       17. FINAL CTA
       ==================================================================== */
    .cta-band {
      position: relative; overflow: hidden; border-radius: 30px;
      background: linear-gradient(135deg, #FFC6FF 0%, #FFADAD 55%, #FFD6A5 100%);
      padding: clamp(42px, 6.5vw, 76px) clamp(24px, 5vw, 70px);
      text-align: center;
    }
    .cta-band::before {
      content: ''; position: absolute; top: -160px; left: 50%; transform: translateX(-50%);
      width: 620px; height: 420px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0) 70%);
    }
    .cta-band::after {
      content: ''; position: absolute; inset: 0;

    /* ====================================================================
       18. CONTACT
       ==================================================================== */

      display: grid; grid-template-columns: 0.92fr 1.08fr;
      gap: clamp(30px, 4.5vw, 58px); align-items: start;

    .contact-point p { font-size: 0.89rem; color: var(--muted); }

    .privacy-note svg { flex-shrink: 0; margin-top: 1px; }
    .form-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 24px; box-shadow: var(--shadow-lg); padding: clamp(24px, 3.4vw, 38px);

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { margin-bottom: 18px; }
    .field label {
      display: block; font-size: 0.85rem; font-weight: 700;

      width: 100%; font-family: inherit; font-size: 0.95rem; color: var(--text);
      background: var(--bg); border: 1.5px solid var(--border); border-radius: 12px;
      padding: 13px 15px; transition: border-color 0.22s var(--ease), box-shadow 0.22s var(--ease), background 0.22s var(--ease);

      outline: none; background: var(--white);

    .field.invalid input, .field.invalid textarea { border-color: var(--danger); }
    .field.invalid input:focus, .field.invalid textarea:focus { box-shadow: 0 0 0 4px rgba(255, 173, 173, 0.95); }

      display: flex; align-items: center; gap: 6px;
      font-size: 0.8rem; font-weight: 700; color: var(--navy); margin-top: 6px;
    }
    .form-status {
      border-radius: 14px; padding: 14px 16px; margin-bottom: 18px;
      font-size: 0.9rem; font-weight: 600; display: flex; gap: 10px; align-items: flex-start;
    }
    .form-status svg { flex-shrink: 0; margin-top: 2px; }
    .form-status.success { background: var(--mint); color: #0E2A4E; }

    .form-status.info { background: var(--blue-soft); color: var(--blue-dark); }
    .spinner {
      width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
      border: 2.5px solid rgba(14, 42, 78, 0.28); border-top-color: #0E2A4E;
      animation: spinOnce 0.8s linear infinite;

    /* ====================================================================
       19. FOOTER
       ==================================================================== */
    .footer { background: var(--pastel-blue); color: var(--text); padding: clamp(48px, 6vw, 72px) 0 30px; }
    .footer-grid {
      display: grid; grid-template-columns: 1.5fr 1fr 1fr;

    }
    .hero-deco .d-blob-pink {

    }

      animation: floaty 11s ease-in-out 2s infinite;
    }
    .hero-deco .d-dot { border-radius: 50%; }
    .hero-deco .d-dot-pink {
      width: 16px; height: 16px; background: rgba(255, 198, 255, 0.85); top: 31%; left: 6.5%;

    }
    .hero-deco .d-dot-gold {
      width: 13px; height: 13px; background: rgba(255, 214, 165, 0.9); top: 21%; right: 15%;

    .hero-deco .d-q-pink { color: #FFC6FF; top: 60%; right: 1.8%; transform: rotate(14deg); }
    .hero-deco .d-arrow {
      width: clamp(92px, 10vw, 138px); top: 11%; right: 21%; transform: rotate(6deg);
      animation: floaty 12s ease-in-out 0.9s infinite;
    }

    /* Poster-style floating expense chips around the hero dashboard */
    .chip-float {
      position: absolute; z-index: 6; width: max-content; max-width: 210px;
      background: var(--white); border: 1px solid var(--border); border-radius: 16px;

    .chip-float .cf-tag {

    .cta-band .cta-deco, .packages-section .pkg-deco {

       ==================================================================== */
    @media (max-width: 1080px) {
      .trust-grid { grid-template-columns: repeat(2, 1fr); }

      .services-grid { grid-template-columns: repeat(2, 1fr); }

      .footer-grid { grid-template-columns: 1fr 1fr; }
      .footer-brand-col { grid-column: 1 / -1; }

      .step-num { grid-row: span 2; width: 60px; height: 60px; margin: 0; border-radius: 17px; }
      .step p { margin-inline: 0; max-width: none; }
      .form-row { grid-template-columns: 1fr; gap: 0; }
      .stat-row { grid-template-columns: 1fr 1fr; }
      .stat-row .stat:last-child { grid-column: 1 / -1; }

      .dash-float.br { right: -4px; }

    @media (max-width: 560px) {

      .dash-label { position: static; transform: none; display: inline-block; margin-top: 14px; }
      .showcase-shell { border-radius: 22px; }
    }

       21. REDUCED MOTION
       ==================================================================== */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }

    }

    /* ==================================================================
       REVEAL HOOK
       ================================================================== */
    function useReveal() {
      const ref = useRef(null);
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const targets = [];
        if (el.hasAttribute("data-reveal")) targets.push(el);
        el.querySelectorAll("[data-reveal]").forEach((n) => targets.push(n));
        if (REDUCED_MOTION || typeof IntersectionObserver === "undefined") {
          targets.forEach((t) => t.classList.add("is-visible"));
          return;
        }
        const io = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              io.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });
        targets.forEach((t) => io.observe(t));
        return () => io.disconnect();
      }, []);
      return ref;
    }

    /* ==================================================================
       CHART HELPERS
       ================================================================== */
    function buildSmoothPath(values, w, h, padY) {
      const max = Math.max(...values);
      const min = Math.min(...values);
      const range = max - min || 1;
      const padX = 10;
      const pts = values.map((v, i) => {
        const x = padX + (i * (w - padX * 2)) / (values.length - 1);
        const y = h - padY - ((v - min) / range) * (h - padY * 2);
        return [x, y];
      });
      let d = "M " + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
      for (let i = 0; i < pts.length - 1; i++) {
        const [x0, y0] = pts[i];
        const [x1, y1] = pts[i + 1];
        const cx = ((x0 + x1) / 2).toFixed(1);
        d += " C " + cx + " " + y0.toFixed(1) + ", " + cx + " " + y1.toFixed(1) + ", " + x1.toFixed(1) + " " + y1.toFixed(1);
      }
      const area = d + " L " + pts[pts.length - 1][0].toFixed(1) + " " + h + " L " + pts[0][0].toFixed(1) + " " + h + " Z";
      return { line: d, area: area, last: pts[pts.length - 1] };
    }

    const Navbar = () => {
      const [scrolled, setScrolled] = useState(false);
      const [menuOpen, setMenuOpen] = useState(false);
      const [active, setActive] = useState("#home");

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 24);
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      useEffect(() => {
        const ids = NAV_LINKS.map((l) => l.href.slice(1));
        const sections = ids.map((id) => document.getElementById(id)).filter(Boolean);
        if (!sections.length || typeof IntersectionObserver === "undefined") return;
        const io = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) setActive("#" + entry.target.id);
          });
        }, { rootMargin: "-42% 0px -52% 0px", threshold: 0 });
        sections.forEach((s) => io.observe(s));
        return () => io.disconnect();
      }, []);

      useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape") setMenuOpen(false); };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);

      useEffect(() => {
        document.body.style.overflow = menuOpen ? "hidden" : "";
        return () => { document.body.style.overflow = ""; };
      }, [menuOpen]);

      const closeMenu = useCallback(() => setMenuOpen(false), []);

      return (
        <React.Fragment>
          <header className={"nav" + (scrolled || menuOpen ? " scrolled" : "")}>
            <div className="nav-inner">
              <Logo />
              <nav className="nav-links" aria-label="Primary">
                {NAV_LINKS.map((l) => (
                  <a key={l.href} href={l.href}
                     className={"nav-link" + (active === l.href ? " active" : "")}
                     aria-current={active === l.href ? "page" : undefined}>
                    {l.label}
                  </a>
                ))}
              </nav>
              <div className="nav-cta">
                <a className="btn btn-primary" href="#contact">Book a Consultation</a>
              </div>
              <button
                className={"burger" + (menuOpen ? " open" : "")}
                onClick={() => setMenuOpen((v) => !v)}
                aria-label={menuOpen ? "Close menu" : "Open menu"}
                aria-expanded={menuOpen}
                aria-controls="mobile-menu">
                <span></span><span></span><span></span>
              </button>
            </div>
          </header>
          <div className={"mobile-overlay" + (menuOpen ? " open" : "")} onClick={closeMenu} aria-hidden="true"></div>
          <div id="mobile-menu" className={"mobile-panel" + (menuOpen ? " open" : "")}>
            <nav className="mobile-links" aria-label="Mobile">
              {NAV_LINKS.map((l) => (
                <a key={l.href} href={l.href} onClick={closeMenu}
                   className={"mobile-link" + (active === l.href ? " active" : "")}>
                  {l.label}
                </a>
              ))}
            </nav>
            <a className="btn btn-primary btn-block" href="#contact" onClick={closeMenu}>Book a Consultation</a>
          </div>
        </React.Fragment>
      );
    };

        </section>
      );
    };

    /* ==================================================================
       CONTACT
       ================================================================== */
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    const ContactForm = () => {
      const [values, setValues] = useState({ name: "", email: "", company: "", message: "" });
      const [errors, setErrors] = useState({});
      const [status, setStatus] = useState("idle"); // idle | sending | success | error | mailopened
      const formRef = useRef(null);

      const validate = (v) => {
        const e = {};
        if (!v.name.trim()) e.name = "Please enter your full name.";
        else if (v.name.trim().length < 2) e.name = "Name looks too short.";
        if (!v.email.trim()) e.email = "Please enter your business email.";
        else if (!EMAIL_RE.test(v.email.trim())) e.email = "Please enter a valid email address.";
        if (!v.message.trim()) e.message = "Please tell us a little about your bookkeeping needs.";
        else if (v.message.trim().length < 10) e.message = "A few more details would help (10+ characters).";
        return e;
      };

      const handleChange = (e) => {
        const { name, value } = e.target;
        setValues((prev) => ({ ...prev, [name]: value }));
        if (errors[name]) {
          setErrors((prev) => {
            const next = { ...prev };
            delete next[name];
            return next;
          });
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (status === "sending") return; // duplicate-submission guard
        const errs = validate(values);
        setErrors(errs);
        if (Object.keys(errs).length) {
          setStatus("idle");
          const first = Object.keys(errs)[0];
          const field = formRef.current && formRef.current.elements[first];
          if (field) field.focus();
          return;
        }
        setStatus("sending");
        try {
          if (!CONTACT_ENDPOINT) {
            // No backend connected: open the visitor's email app with a compose
            // window pre-filled from the form fields (recipient + subject + body).
            const name = values.name.trim();
            const company = values.company.trim();
            const subject = "Consultation inquiry" + (company ? " — " + company : name ? " — " + name : "");
            const body = [
              "Hi Accounting Harbor,",
              "",
              "I'd like to book a bookkeeping consultation.",
              "",
              "Name: " + name,
              "Email: " + values.email.trim(),
              company ? "Company: " + company : null,
              "",
              "Message:",
              values.message.trim(),
              "",
              "— Sent from the Accounting Harbor website contact form"
            ].filter((line) => line !== null).join("\r\n");
            window.location.href =
              "mailto:" + CONTACT_EMAIL +
              "?subject=" + encodeURIComponent(subject) +
              "&body=" + encodeURIComponent(body);
            setStatus("mailopened");
            return;
          }
          const res = await fetch(CONTACT_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "application/json" },
            body: JSON.stringify({
              fullName: values.name.trim(),
              businessEmail: values.email.trim(),
              companyName: values.company.trim(),
              message: values.message.trim()
            })
          });
          if (!res.ok) throw new Error("Submission failed");
          setStatus("success");
          setValues({ name: "", email: "", company: "", message: "" });
        } catch (err) {
          setStatus("error");
        }
      };

      return (
        <form className="form-card" ref={formRef} onSubmit={handleSubmit} noValidate aria-label="Bookkeeping inquiry form">
          {status === "success" && (
            <div className="form-status success" role="status">
              <IconCheck size={18} />
              <span>Thank you — your inquiry has been sent. You should receive a reply once it has been reviewed.</span>
            </div>
          )}
          {status === "error" && (
            <div className="form-status error" role="alert">
              <IconAlert size={18} />
              <span>Something went wrong while sending your inquiry. Please try again in a moment.</span>
            </div>
          )}
          {status === "mailopened" && (
            <div className="form-status info" role="status">
              <IconInfo size={18} />
              <span>
                Your email app is opening with everything you just entered already filled in —
                all you need to do is press send. If no email window appeared, write to us
                directly at {CONTACT_EMAIL}.
              </span>
            </div>
          )}

          <div className="form-row">
            <div className={"field" + (errors.name ? " invalid" : "")}>
              <label htmlFor="cf-name">Full Name</label>
              <input
                id="cf-name" name="name" type="text" autoComplete="name"
                placeholder="Jane Carter" value={values.name} onChange={handleChange}
                aria-invalid={errors.name ? "true" : "false"}
                aria-describedby={errors.name ? "cf-name-err" : undefined} />
              {errors.name && <p className="field-error" id="cf-name-err"><IconAlert size={14} /> {errors.name}</p>}
            </div>
            <div className={"field" + (errors.email ? " invalid" : "")}>
              <label htmlFor="cf-email">Business Email</label>
              <input
                id="cf-email" name="email" type="email" autoComplete="email"
                placeholder="jane@company.com" value={values.email} onChange={handleChange}
                aria-invalid={errors.email ? "true" : "false"}
                aria-describedby={errors.email ? "cf-email-err" : undefined} />
              {errors.email && <p className="field-error" id="cf-email-err"><IconAlert size={14} /> {errors.email}</p>}
            </div>
          </div>

          <div className="field">
            <label htmlFor="cf-company">Company Name <span className="opt">(optional)</span></label>
            <input
              id="cf-company" name="company" type="text" autoComplete="organization"
              placeholder="Your business name" value={values.company} onChange={handleChange} />
          </div>

          <div className={"field" + (errors.message ? " invalid" : "")}>
            <label htmlFor="cf-message">Message</label>
            <textarea
              id="cf-message" name="message"
              placeholder="Tell us a little about your business and the bookkeeping support you're looking for…"
              value={values.message} onChange={handleChange}
              aria-invalid={errors.message ? "true" : "false"}
              aria-describedby={errors.message ? "cf-message-err" : undefined}></textarea>
            {errors.message && <p className="field-error" id="cf-message-err"><IconAlert size={14} /> {errors.message}</p>}
          </div>

          <button className="btn btn-primary btn-block" type="submit" disabled={status === "sending"}>
            {status === "sending" ? (<React.Fragment><span className="spinner"></span> Sending…</React.Fragment>) : "Send Inquiry"}
          </button>
        </form>
      );
    };

    const ContactSection = () => {
      const ref = useReveal();
      const points = [
        { icon: IconMessage, title: "Share your situation", text: "Describe your business, transaction volume, and what you'd like help organizing." },
        { icon: IconClipboard, title: "We review your needs", text: "Your inquiry is reviewed to understand the kind of bookkeeping support that fits." },
        { icon: IconChat, title: "Discuss the next steps", text: "A consultation conversation covers scope, process, and the proposed arrangement." }
      ];
      return (
        <section className="section" id="contact" ref={ref} aria-labelledby="contact-title">
          <div className="container">
            <div className="contact-grid">
              <div>
                <span className="eyebrow" data-reveal><span className="eyebrow-dot"></span>Contact</span>
                <h2 className="h2" id="contact-title" data-reveal style={{ "--d": "0.06s" }}>
                  Book a Consultation
                </h2>
                <p className="section-desc" data-reveal style={{ "--d": "0.12s" }}>
                  Send an inquiry about your bookkeeping needs and start a conversation about keeping your
                  financial records organized.
                </p>
                <div className="contact-points">
                  {points.map((p, i) => {
                    const Icon = p.icon;
                    return (
                      <div className="contact-point" key={p.title} data-reveal style={{ "--d": (0.18 + i * 0.08) + "s" }}>
                        <span className="cp-icon"><Icon size={20} /></span>
                        <div>
                          <h4>{p.title}</h4>
                          <p>{p.text}</p>
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div className="privacy-note" data-reveal style={{ "--d": "0.44s" }}>
                  <IconLock size={18} />
                  <span>
                    Please don't share bank login details, passwords, or sensitive financial documents
                    through this inquiry form. Secure exchange methods are arranged during onboarding.
                  </span>
                </div>
              </div>
              <div data-reveal style={{ "--d": "0.16s" }}>
                <ContactForm />
              </div>
            </div>
          </div>
        </section>
      );
    };

    /* ==================================================================
       FOOTER
       ================================================================== */
    const Footer = () => {
      const year = new Date().getFullYear();
      return (
        <footer className="footer">
          <div className="container">
            <div className="footer-grid">
              <div className="footer-brand-col">
                <Logo />
                <p className="footer-desc">
                  Accounting Harbor provides bookkeeping support for small and medium-sized businesses,
                  helping keep financial records organized, reviewable, and ready for the decisions ahead.
                </p>
              </div>
              <div>
                <h4>Page</h4>
                <nav className="footer-links" aria-label="Footer">
                  {NAV_LINKS.map((l) => <a key={l.href} href={l.href}>{l.label}</a>)}
                </nav>
              </div>
              <div>
                <h4>Explore</h4>
                <nav className="footer-links" aria-label="Footer sections">
                  <a href="#services">Bookkeeping Services</a>
                  <a href="#packages">Packages &amp; Pricing</a>
                  <a href="#why">Why Accounting Harbor</a>
                  <a href="#showcase">Dashboard Showcase</a>
                  <a href="#faq">FAQ</a>
                  <a href="#contact">Book a Consultation</a>
                </nav>
              </div>
            </div>
            <div className="footer-bottom">
              <p>© {year} Accounting Harbor. All rights reserved.</p>
              <span className="footer-tag"><span className="pulse-dot"></span> Bookkeeping for growing businesses</span>
            </div>
          </div>
        </footer>
      );
    };

    /* ==================================================================
       APP
       ================================================================== */
    const App = () => (
      <React.Fragment>
        <Navbar />
        <main>
          <HeroSection />
          <TrustSection />
          <ServicesSection />
          <PackagesSection />
          <AudienceSection />
          <BenefitsSection />
          <ProcessSection />
          <DashboardShowcase />
          <ExpectationsSection />
          <FAQSection />
          <CTABanner />
          <ContactSection />
        </main>
        <Footer />
      </React.Fragment>
    );

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
